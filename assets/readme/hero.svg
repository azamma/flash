<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">flash</title>
  <desc id="desc">flash, a Claude Code skill: Claude thinks, Jev skims. Art deco lightning bolt over a sunburst; on the right, a real benchmark result: 91% fewer Claude tokens, 26.4k down to 2.4k.</desc>

  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#f3d98b"/>
      <stop offset="0.55" stop-color="#d4a94f"/>
      <stop offset="1" stop-color="#8f6a2a"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#f1e6cc"/>
    </pattern>
    <clipPath id="fan"><rect x="0" y="0" width="320" height="300"/></clipPath>
  </defs>

  <rect width="1200" height="380" rx="26" fill="#0b1211"/>
  <rect width="1200" height="380" rx="26" fill="url(#scan)" opacity="0.035"/>

  <!-- stepped deco corners -->
  <g id="frame" fill="none" stroke="#d4a94f" stroke-width="2" opacity="0.7">
    <path d="M28 76 V44 H44 V28 H76"/>
    <path d="M1124 28 H1156 V44 H1172 V76"/>
    <path d="M28 304 V336 H44 V352 H76"/>
    <path d="M1124 352 H1156 V336 H1172 V304"/>
  </g>

  <!-- sunburst behind the bolt -->
  <g id="sunburst" clip-path="url(#fan)" stroke="#d4a94f" stroke-width="1.5" opacity="0.28">
    <path d="M168 300 L168 20 M168 300 L96 29 M168 300 L28 58 M168 300 L-30 102 M168 300 L240 29 M168 300 L308 58 M168 300 L366 102"/>
    <path d="M60 300 A108 108 0 0 1 276 300" fill="none"/>
    <path d="M20 300 A148 148 0 0 1 316 300" fill="none"/>
  </g>

  <path id="bolt-mark" d="M178 56 L112 176 L154 176 L126 268 L230 142 L186 142 L222 56 Z" fill="url(#brass)" stroke="#0b1211" stroke-width="3" stroke-linejoin="round"/>

  <g id="title-block">
    <text x="290" y="200" font-family="Futura, 'Century Gothic', 'Avenir Next', sans-serif" font-size="112" font-weight="700" letter-spacing="16" fill="#f1e6cc">FLASH</text>
    <path d="M292 228 H486 M514 228 H700" stroke="#d4a94f" stroke-width="2"/>
    <path d="M500 220 L508 228 L500 236 L492 228 Z" fill="#d4a94f"/>
    <text x="292" y="274" font-family="Futura, 'Century Gothic', 'Avenir Next', sans-serif" font-size="22" font-weight="500" letter-spacing="7" fill="#d4a94f">CLAUDE THINKS · JEV SKIMS</text>
    <text x="292" y="322" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#7f8f86">&gt; flash filter "auth?" src</text>
    <rect x="612" y="306" width="11" height="20" fill="#d4a94f"/>
  </g>

  <path d="M800 92 V288" stroke="#d4a94f" stroke-width="2" opacity="0.6"/>

  <!-- one real result: benchmark task 6, Hono codebase discovery -->
  <g id="project-proof" font-family="Futura, 'Century Gothic', 'Avenir Next', sans-serif" text-anchor="middle">
    <text x="984" y="200" font-size="104" font-weight="700" fill="url(#brass)">−91%</text>
    <text x="984" y="244" font-size="20" font-weight="500" letter-spacing="6" fill="#f1e6cc">CLAUDE TOKENS</text>
    <text x="984" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#7f8f86">26.4k → 2.4k</text>
  </g>
</svg>
